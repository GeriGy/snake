<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --grid-a: #171a23;
    --grid-b: #1c1f2a;
    --snake-head: #7ee787;
    --snake-body: #3fb950;
    --food: #f85149;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 2px;
    font-weight: 700;
  }
  .hud {
    display: flex;
    gap: 24px;
    align-items: center;
    background: var(--panel);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 15px;
    min-width: 320px;
    justify-content: space-between;
  }
  .hud span.label {
    color: var(--muted);
    margin-right: 6px;
  }
  .board-container {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    border: 2px solid #2a2f3d;
  }
  canvas {
    display: block;
    background: var(--grid-a);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 12, 18, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    margin: 0;
    font-size: 26px;
  }
  .overlay p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    max-width: 280px;
    line-height: 1.5;
  }
  button {
    background: var(--accent);
    color: #0b1220;
    border: none;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.1s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.96); }
  .controls-hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    max-width: 340px;
    line-height: 1.5;
  }
  .touch-controls {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    margin-top: 4px;
  }
  .touch-controls button.dir {
    background: var(--panel);
    color: var(--text);
    font-size: 20px;
    padding: 0;
    border: 1px solid #2a2f3d;
  }
  @media (pointer: coarse) {
    .touch-controls { display: grid; }
  }
  kbd {
    background: #2a2f3d;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>SNAKE</h1>
    <div class="hud">
      <div><span class="label">Score</span><span id="score">0</span></div>
      <div><span class="label">Best</span><span id="best">0</span></div>
      <div><span class="label">Speed</span><span id="speed">1</span></div>
    </div>

    <div class="board-container">
      <canvas id="board" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">Snake</h2>
        <p id="overlay-msg">Use arrow keys or WASD to move. Eat the food, avoid the walls and yourself.</p>
        <button id="start-btn">Start Game</button>
      </div>
    </div>

    <div class="controls-hint">
      Move with <kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>.
      Press <kbd>Space</kbd> to pause. Press <kbd>Enter</kbd> to restart after game over.
    </div>

    <div class="touch-controls" id="touch-controls">
      <div></div>
      <button class="dir" data-dir="up">&uarr;</button>
      <div></div>
      <button class="dir" data-dir="left">&larr;</button>
      <div></div>
      <button class="dir" data-dir="right">&rarr;</button>
      <div></div>
      <button class="dir" data-dir="down">&darr;</button>
      <div></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var speedEl = document.getElementById("speed");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlayMsg = document.getElementById("overlay-msg");
  var startBtn = document.getElementById("start-btn");
  var touchControls = document.getElementById("touch-controls");

  var GRID_SIZE = 20;                 // cells per side
  var CELL = canvas.width / GRID_SIZE; // pixel size of a cell

  var BASE_INTERVAL = 130;  // ms per tick at speed level 1
  var MIN_INTERVAL = 60;    // fastest tick allowed
  var SPEEDUP_EVERY = 5;    // foods eaten per speed level

  var state = {
    snake: [],
    dir: { x: 1, y: 0 },
    nextDir: { x: 1, y: 0 },
    food: null,
    score: 0,
    best: 0,
    running: false,
    paused: false,
    gameOver: false,
    tickInterval: BASE_INTERVAL,
    lastTick: 0,
    speedLevel: 1
  };

  function loadBest() {
    try {
      var v = localStorage.getItem("snake-best-score");
      return v ? parseInt(v, 10) || 0 : 0;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(v) {
    try {
      localStorage.setItem("snake-best-score", String(v));
    } catch (e) {
      /* ignore storage errors (private mode, etc.) */
    }
  }

  state.best = loadBest();
  bestEl.textContent = state.best;

  function resetState() {
    var mid = Math.floor(GRID_SIZE / 2);
    state.snake = [
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
      { x: mid - 3, y: mid }
    ];
    state.dir = { x: 1, y: 0 };
    state.nextDir = { x: 1, y: 0 };
    state.score = 0;
    state.paused = false;
    state.gameOver = false;
    state.tickInterval = BASE_INTERVAL;
    state.speedLevel = 1;
    scoreEl.textContent = "0";
    speedEl.textContent = "1";
    placeFood();
  }

  function placeFood() {
    var occupied = {};
    for (var i = 0; i < state.snake.length; i++) {
      occupied[state.snake[i].x + "," + state.snake[i].y] = true;
    }
    var free = [];
    for (var x = 0; x < GRID_SIZE; x++) {
      for (var y = 0; y < GRID_SIZE; y++) {
        var key = x + "," + y;
        if (!occupied[key]) free.push({ x: x, y: y });
      }
    }
    if (free.length === 0) {
      state.food = null;
      return;
    }
    state.food = free[Math.floor(Math.random() * free.length)];
  }

  function setDirection(x, y) {
    // prevent reversing directly into itself
    if (state.dir.x === -x && state.dir.y === -y && state.snake.length > 1) return;
    state.nextDir = { x: x, y: y };
  }

  var KEY_MAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") {
      e.preventDefault();
      togglePause();
      return;
    }
    if (e.key === "Enter" && state.gameOver) {
      startGame();
      return;
    }
    var mapped = KEY_MAP[e.key];
    if (mapped) {
      e.preventDefault();
      if (!state.running) startGame();
      setDirection(mapped[0], mapped[1]);
    }
  });

  touchControls.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-dir]");
    if (!btn) return;
    if (!state.running) startGame();
    var dir = btn.getAttribute("data-dir");
    if (dir === "up") setDirection(0, -1);
    else if (dir === "down") setDirection(0, 1);
    else if (dir === "left") setDirection(-1, 0);
    else if (dir === "right") setDirection(1, 0);
  });

  // basic swipe support
  var touchStart = null;
  canvas.addEventListener("touchstart", function (e) {
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 20) setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      if (Math.abs(dy) > 20) setDirection(0, dy > 0 ? 1 : -1);
    }
    if (!state.running) startGame();
    touchStart = null;
  }, { passive: true });

  function togglePause() {
    if (!state.running || state.gameOver) return;
    state.paused = !state.paused;
    if (state.paused) {
      showOverlay("Paused", "Press Space to resume.", "Resume");
    } else {
      hideOverlay();
      state.lastTick = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function showOverlay(title, msg, btnText) {
    overlayTitle.textContent = title;
    overlayMsg.textContent = msg;
    startBtn.textContent = btnText;
    overlay.classList.remove("hidden");
  }

  function hideOverlay() {
    overlay.classList.add("hidden");
  }

  function startGame() {
    resetState();
    state.running = true;
    hideOverlay();
    state.lastTick = performance.now();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener("click", function () {
    if (state.paused) {
      togglePause();
    } else {
      startGame();
    }
  });

  function endGame() {
    state.running = false;
    state.gameOver = true;
    if (state.score > state.best) {
      state.best = state.score;
      saveBest(state.best);
      bestEl.textContent = state.best;
    }
    showOverlay("Game Over", "Score: " + state.score + "  •  Best: " + state.best, "Play Again");
  }

  function step() {
    state.dir = state.nextDir;

    var head = state.snake[0];
    var newHead = { x: head.x + state.dir.x, y: head.y + state.dir.y };

    // wall collision
    if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
      endGame();
      return;
    }

    // self collision (check against body, tail excluded since it will move unless eating)
    for (var i = 0; i < state.snake.length; i++) {
      if (state.snake[i].x === newHead.x && state.snake[i].y === newHead.y) {
        endGame();
        return;
      }
    }

    state.snake.unshift(newHead);

    var ateFood = state.food && newHead.x === state.food.x && newHead.y === state.food.y;
    if (ateFood) {
      state.score += 10;
      scoreEl.textContent = state.score;
      if (state.score / 10 % SPEEDUP_EVERY === 0) {
        state.speedLevel += 1;
        speedEl.textContent = state.speedLevel;
        state.tickInterval = Math.max(MIN_INTERVAL, BASE_INTERVAL - (state.speedLevel - 1) * 10);
      }
      placeFood();
      if (!state.food) {
        // board full: player won
        endGame();
      }
    } else {
      state.snake.pop();
    }
  }

  function draw() {
    // checkerboard background
    for (var x = 0; x < GRID_SIZE; x++) {
      for (var y = 0; y < GRID_SIZE; y++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? "#171a23" : "#1c1f2a";
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    // food
    if (state.food) {
      ctx.fillStyle = "#f85149";
      var fx = state.food.x * CELL + CELL / 2;
      var fy = state.food.y * CELL + CELL / 2;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    // snake
    for (var i = 0; i < state.snake.length; i++) {
      var seg = state.snake[i];
      ctx.fillStyle = i === 0 ? "#7ee787" : "#3fb950";
      var pad = i === 0 ? 1 : 2;
      var r = i === 0 ? 6 : 4;
      roundRect(
        seg.x * CELL + pad,
        seg.y * CELL + pad,
        CELL - pad * 2,
        CELL - pad * 2,
        r
      );
      ctx.fill();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loop(now) {
    if (!state.running || state.paused) return;
    var elapsed = now - state.lastTick;
    if (elapsed >= state.tickInterval) {
      state.lastTick = now;
      step();
      if (!state.running) {
        draw();
        return;
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // initial paint before game starts
  resetState();
  draw();
})();
</script>
</body>
</html>
